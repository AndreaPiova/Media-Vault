<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediaVault · Scelta poster Anime</title>
<style>
:root{--bg:#0a0a1a;--card:#14142b;--ac:#a78bfa;--tx:#e8e8f4;--mut:#8888aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
#bar{position:sticky;top:0;z-index:5;background:#0d0d22;border-bottom:1px solid #2a2a4a;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#bar input,#bar select,#bar button{background:#1b1b38;color:var(--tx);border:1px solid #33335a;border-radius:7px;padding:7px 9px;font-size:13px}
#bar button.go{background:var(--ac);color:#10102a;font-weight:700;border:0}
#q{flex:1;min-width:120px}#st{width:100%;font-size:12px;color:var(--mut);min-height:16px}
.an{background:var(--card);margin:10px 8px;padding:10px;border-radius:10px}
.an h3{margin:0 0 6px;font-size:15px}.an h3 small{color:var(--mut);font-weight:400}
.se{margin:6px 0 10px}.se b{font-size:12px;color:var(--mut)}
.row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.th{position:relative;flex:0 0 auto;width:92px;border:2px solid transparent;border-radius:7px;overflow:hidden;cursor:pointer;background:#000}
.th img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
.th i{position:absolute;left:3px;top:3px;background:#000a;color:#fff;font:700 10px sans-serif;padding:1px 5px;border-radius:4px;font-style:normal}
.th.cur{opacity:.75;cursor:default}.th.cur i{background:#444}
.th.sel{border-color:var(--ac);box-shadow:0 0 8px var(--ac)}
.th.done{border-color:#4ade80}.th.done i{background:#16a34a}
.hide{display:none!important}
</style></head><body>
<div id="bar">
 <input id="q" placeholder="Cerca anime…" oninput="render()">
 <select id="fl" onchange="render()"><option value="all">Tutti</option><option value="todo">Non scelti</option><option value="sel">Scelti</option><option value="done">Caricati</option></select>
 <select id="lg" onchange="render()"><option value="all">JA + EN</option><option value="ja">Solo JA</option><option value="en">Solo EN</option></select>
 <button onclick="setToken()">🔑 Token</button>
 <button class="go" onclick="uploadAll()">⬆ Carica scelti (<span id="n">0</span>)</button>
 <button onclick="clearSel()">✕ Svuota</button>
 <div id="st"></div>
</div>
<div id="app">Caricamento…</div>
<script>
const REPO='AndreaPiova/Media-Vault',IMG='https://image.tmdb.org/t/p/';
let D={},SEL={},DONE={},TK='';
const KV={db:null,open(){return new Promise(r=>{try{const q=indexedDB.open('mvp_picker',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{KV.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
 get(k){return new Promise(r=>{if(!KV.db)return r(undefined);try{const q=KV.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)}catch(e){r(undefined)}})},
 set(k,v){try{if(KV.db)KV.db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}};
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function initStore(){await KV.open();
 SEL=(await KV.get('sel'))||JSON.parse(ls('mvp_sel')||'{}');DONE=(await KV.get('done'))||JSON.parse(ls('mvp_done')||'{}');TK=(await KV.get('tk'))||ls('mvp_tk')||'';
 if(!KV.db)st('⚠ Archivio del browser non disponibile: le scelte restano solo finché la pagina è aperta.')}
const $=id=>document.getElementById(id);
function save(){KV.set('sel',SEL);KV.set('done',DONE);$('n').textContent=Object.keys(SEL).filter(k=>!DONE[k]||DONE[k]!==SEL[k]).length}
function st(t){$('st').textContent=t}
function setToken(){const t=prompt('Token GitHub (resta solo in questo browser):',TK);if(t!==null){TK=t.trim();KV.set('tk',TK)}}
function pick(key,p){if(SEL[key]===p)delete SEL[key];else SEL[key]=p;save();paint(key)}
function paint(key){document.querySelectorAll('[data-k="'+key+'"]').forEach(e=>{e.classList.toggle('sel',SEL[key]===e.dataset.p);e.classList.toggle('done',DONE[key]===e.dataset.p&&SEL[key]===e.dataset.p)})}
function clearSel(){if(confirm('Svuotare le scelte non ancora caricate?')){for(const k in SEL)if(DONE[k]!==SEL[k])delete SEL[k];save();render()}}
function render(){
 const q=$('q').value.toLowerCase(),fl=$('fl').value,lg=$('lg').value;let h='';
 for(const id in D){const a=D[id];if(q&&!a.title.toLowerCase().includes(q))continue;
  const keys=Object.keys(a.seasons).map(k=>id+'_s'+k);
  const nsel=keys.filter(k=>SEL[k]).length,ndone=keys.filter(k=>DONE[k]&&DONE[k]===SEL[k]).length;
  if(fl==='todo'&&nsel)continue;if(fl==='sel'&&!nsel)continue;if(fl==='done'&&!ndone)continue;
  let s='';
  for(const k in a.seasons){const se=a.seasons[k],key=id+'_s'+k;
   let t=se.cur?`<div class="th cur"><img loading="lazy" src="${se.cur}"><i>ATTUALE</i></div>`:'';
   for(const c of se.c){if(lg!=='all'&&c.l!==lg)continue;
    t+=`<div class="th${SEL[key]===c.p?' sel':''}${DONE[key]===c.p&&SEL[key]===c.p?' done':''}" data-k="${key}" data-p="${c.p}" onclick="pick('${key}','${c.p}')"><img loading="lazy" src="${IMG}w185${c.p}"><i>${c.l.toUpperCase()}</i></div>`}
   s+=`<div class="se"><b>S${k} · ${se.label||''}${se.c.length?'':' (nessun candidato)'}</b><div class="row">${t}</div></div>`}
  h+=`<div class="an"><h3>${a.title} <small>${a.tmdb?'TMDB: '+a.tmdb[2]:'non trovato su TMDB'}</small></h3>${s}</div>`}
 $('app').innerHTML=h||'Nessun risultato';save()}
async function blobOf(url){for(const u of [url,'https://images.weserv.nl/?url='+encodeURIComponent(url.replace(/^https?:\/\//,''))+'&output=jpg']){try{const r=await fetch(u);if(r.ok)return await r.blob()}catch(e){}}throw new Error('download immagine fallito')}
async function toJpg(p){const b=await createImageBitmap(await blobOf(IMG+'w780'+p));const c=document.createElement('canvas');c.width=780;c.height=1170;const x=c.getContext('2d');x.fillStyle='#0a0a1a';x.fillRect(0,0,780,1170);const s=Math.max(780/b.width,1170/b.height),w=b.width*s,h=b.height*s;x.drawImage(b,(780-w)/2,(1170-h)/2,w,h);return c.toDataURL('image/jpeg',.85).split(',')[1]}
async function api(path,opt){const tk=TK;if(!tk)throw new Error('manca il token (🔑)');
 const r=await fetch('https://api.github.com/repos/'+REPO+path,{...opt,headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'}});
 if(!r.ok)throw new Error('GitHub '+r.status+' '+(await r.text()).slice(0,90));return r.json()}
let busy=false;
async function uploadAll(){if(busy)return;busy=true;
 const todo=Object.keys(SEL).filter(k=>DONE[k]!==SEL[k]);if(!todo.length){busy=false;st('Niente da caricare.');return}
 try{
  const files=[];
  for(let i=0;i<todo.length;i++){const key=todo[i],[id,sn]=key.split('_s'),a=D[id];st(`Preparo ${i+1}/${todo.length}: ${a.title} S${sn}…`);
   const b64=await toJpg(SEL[key]);if(!a.movie)files.push({key,path:`covers/anime/${a.slug}_s${sn}.jpg`,b64});
   if(sn==='1')files.push({key,path:`covers/anime/${a.slug}_poster.jpg`,b64})}
  const tree=[];
  for(let i=0;i<files.length;i++){st(`Invio ${i+1}/${files.length} su GitHub…`);
   const b=await api('/git/blobs',{method:'POST',body:JSON.stringify({content:files[i].b64,encoding:'base64'})});
   tree.push({path:files[i].path,mode:'100644',type:'blob',sha:b.sha})}
  st('Creo il commit unico…');
  const ref=await api('/git/ref/heads/main'),cm=await api('/git/commits/'+ref.object.sha);
  const t=await api('/git/trees',{method:'POST',body:JSON.stringify({base_tree:cm.tree.sha,tree})});
  const c=await api('/git/commits',{method:'POST',body:JSON.stringify({message:`Poster anime scelti (${todo.length})`,tree:t.sha,parents:[ref.object.sha]})});
  await api('/git/refs/heads/main',{method:'PATCH',body:JSON.stringify({sha:c.sha})});
  todo.forEach(k=>{DONE[k]=SEL[k]});save();render();
  st(`✅ Caricati ${todo.length} poster in un solo commit.`)
 }catch(e){st('⚠ '+e.message);console.error(e)}
 busy=false}
async function load(){
 const U=['data/anime-poster-candidates.json','https://raw.githubusercontent.com/'+REPO+'/main/data/anime-poster-candidates.json','https://andreapiova.github.io/Media-Vault/data/anime-poster-candidates.json'];
 let err=[];
 for(const u of U){try{const r=await fetch(u+'?t='+Date.now());if(!r.ok){err.push(u.slice(0,40)+' → '+r.status);continue}D=await r.json();render();return}catch(e){err.push(u.slice(0,40)+' → '+e.message)}}
 $('app').innerHTML='<div style="padding:16px">⚠ Impossibile caricare i candidati.<br><small style="color:#8888aa">'+err.join('<br>')+'</small><br><br><button onclick="load()">Riprova</button></div>'}
$('app').textContent='Caricamento candidati…';initStore().then(load);
</script></body></html>
