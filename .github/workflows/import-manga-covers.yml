name: Import manga covers (AnimeClick)
on:
  push:
    paths: ['scripts/manga-covers.trigger']
  workflow_dispatch:
    inputs:
      only:
        description: "ID manga separati da virgola (vuoto = tutti)"
        required: false
        default: ""
concurrency: { group: manga-covers, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: |
          git config user.name "mediavault-bot"
          git config user.email "bot@users.noreply.github.com"
      - run: python scripts/import-manga-covers.py
        env:
          ONLY: ${{ github.event.inputs.only }}
