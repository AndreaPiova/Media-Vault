name: anime-verify
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/anime-verify.py
      - name: Salva risultati
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/anime-mal-ids.json data/anime-verify-report.json data/anime-verify-report.md data/anilist-anime-dump.json
          git commit -m "Verifica anime: id MAL, personaggi, generi" || echo "nessuna modifica"
          git push
