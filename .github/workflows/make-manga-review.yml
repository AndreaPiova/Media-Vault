name: Prepara zip di revisione manga
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/make-manga-review.py
      - run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan review-manga
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f review-zips
          git commit -m "zip di revisione manga (ramo temporaneo)"
          git push -f origin review-manga
