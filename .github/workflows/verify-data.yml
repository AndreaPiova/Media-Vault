name: Verify data
on:
  push:
    paths: ['scripts/verify.trigger']
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sec: [films, series, anime, manga]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/verify-data.py ${{ matrix.sec }}
      - if: always()
        run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/verify; git commit -m "verify ${{ matrix.sec }}" || true
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM%8+2)); done
