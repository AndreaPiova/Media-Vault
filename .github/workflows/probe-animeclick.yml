name: Probe AnimeClick manga covers
on:
  push:
    paths: ['scripts/probe/animeclick.trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          P=data/probe-animeclick.txt; : > $P
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          t(){ echo "== $1" >> $P; curl -sS -L -m 25 -A "$UA" -H "Accept-Language: it-IT,it;q=0.9" -o /tmp/o -w "%{http_code} %{size_download}\n" "$1" >> $P 2>&1; cp /tmp/o /tmp/last; }
          t "https://www.animeclick.it/manga/9551/slam-dunk/edizioni"
          grep -o -E 'href="[^"]*/edizione/[0-9]+/[^"]*"' /tmp/last | sort -u | head -40 >> $P
          E1=$(grep -o -E '/edizione/[0-9]+/[a-z0-9.\-]+' /tmp/last | head -1)
          echo "first edition link: $E1" >> $P
          [ -n "$E1" ] && t "https://www.animeclick.it$E1" && head -c 6000 /tmp/last >> $P && echo >> $P && grep -o -E '(src|data-src|content)="[^"]*(jpg|jpeg|png|webp)[^"]*"' /tmp/last | sort -u | head -30 >> $P
          t "https://www.googleapis.com/books/v1/volumes?q=slam+dunk+1+star+comics&maxResults=2"
          head -c 800 /tmp/last >> $P; echo >> $P
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add $P; git commit -m "probe animeclick" || true; git pull --rebase -X theirs || true; git push
