name: Esplora siti editori
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/discover-publishers.py
      - run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports/discover3.txt; git commit -m "report esplorazione editori" ; git pull --rebase; git push
