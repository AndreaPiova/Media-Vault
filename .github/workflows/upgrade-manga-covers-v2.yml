name: Upgrade manga covers v2
on:
  push:
    paths: ['scripts/v2.trigger']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/upgrade-manga-covers-v2.py
        continue-on-error: true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add covers/manga data; git commit -m "v2 finale" || true; git pull --rebase -X theirs || true; git push
