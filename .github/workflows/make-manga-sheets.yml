name: Schede confronto manga
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/make-manga-sheets.py
      - run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports/manga-upgrade/sheets
          git commit -m "Schede confronto copertine manga"
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 6; done
