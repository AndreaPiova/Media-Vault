name: Diag hires
on:
  push:
    paths: ['scripts/diag.trigger']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/diag-hires.py
        continue-on-error: true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/diag.txt covers/manga; git commit -m "diag hires" || true; git pull --rebase -X theirs || true; git push
