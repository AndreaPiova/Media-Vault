name: Upgrade manga covers (hires, IBS/Feltrinelli)
on:
  push:
    paths: ['scripts/manga-hires.trigger']
  workflow_dispatch:
    inputs:
      only: { description: "ID manga separati da virgola (vuoto = tutti)", required: false, default: "" }
concurrency: { group: manga-hires, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: |
          git config user.name "mediavault-bot"
          git config user.email "bot@users.noreply.github.com"
      - run: python scripts/upgrade-manga-covers-hires.py
        env:
          ONLY: ${{ github.event.inputs.only }}
