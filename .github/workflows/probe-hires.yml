name: Probe hires covers
on:
  push:
    paths: ['scripts/probe/hires.trigger']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/probe-hires.py
        continue-on-error: true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/probe-hires.txt; git commit -m "probe hires" || true; git pull --rebase -X theirs || true; git push
