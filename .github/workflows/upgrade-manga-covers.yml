name: Migliora copertine manga (Star Comics / J-POP)
on:
  workflow_dispatch:
    inputs:
      start: { description: "indice di partenza", default: "0" }
      count: { description: "quanti file", default: "40" }
      mode: { description: "dry = solo report, apply = sostituisce", default: "dry" }
      only: { description: "filtro nome file (opzionale)", default: "" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow numpy
      - run: python scripts/upgrade-manga-covers.py
        env:
          START: ${{ github.event.inputs.start }}
          COUNT: ${{ github.event.inputs.count }}
          MODE: ${{ github.event.inputs.mode }}
          ONLY: ${{ github.event.inputs.only }}
      - run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add covers/manga reports/manga-upgrade
          git commit -m "Manga: copertine migliorate da Star Comics/J-POP (${{ github.event.inputs.mode }} ${{ github.event.inputs.start }}+${{ github.event.inputs.count }})" || echo "niente da committare"
          git pull --rebase; git push
