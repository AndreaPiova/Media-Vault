name: Probe publishers
on:
  push:
    paths: ['scripts/probe.trigger']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/probe-publishers.py
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/probe; git commit -m "probe" || true; git pull --rebase -X theirs || true; git push
