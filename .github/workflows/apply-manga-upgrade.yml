name: Applica sostituzione copertine manga
on:
  workflow_dispatch:
    inputs:
      start: { description: "indice di partenza", default: "0" }
      count: { description: "quanti file", default: "1000" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow numpy
      - run: python scripts/apply-manga-upgrade.py
        env:
          START: ${{ github.event.inputs.start }}
          COUNT: ${{ github.event.inputs.count }}
