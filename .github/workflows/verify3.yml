name: Verify data v3
on:
  push:
    paths: ['scripts/verify3.trigger']
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job: [anime 0/4, anime 1/4, anime 2/4, anime 3/4, manga 0/1, libri 0/1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/verify3.py ${{ matrix.job }}
      - if: always()
        run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/verify3; git commit -m "verify3 ${{ matrix.job }}" || true
          for i in 1 2 3 4 5 6; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM%10+3)); done
