name: Collect anime poster candidates (TMDB)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/collect-poster-candidates.py
        env:
          TMDB_KEY: 2dca580c2a14b55200e784d157207b4d
      - run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/anime-poster-candidates.json
          git commit -m "Anime poster candidates (TMDB)" || echo nothing
          git push
