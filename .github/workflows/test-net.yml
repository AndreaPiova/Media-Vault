name: Test rete editori
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p reports
          for u in https://www.starcomics.com https://www.j-pop.it https://www.panini.it; do
            echo "== $u" >> reports/net-test.txt
            curl -s -m 20 -o /dev/null -w "HTTP %{http_code}\n" -A "Mozilla/5.0" "$u" >> reports/net-test.txt
          done
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports/net-test.txt; git commit -m "test rete editori" ; git push
