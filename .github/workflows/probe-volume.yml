name: Probe volume page
on:
  push:
    paths: ['scripts/probe/volume.trigger']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          P=data/probe-volume.txt; : > $P
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          g(){ curl -sS -L -m 25 -A "$UA" -H "Accept-Language: it-IT,it;q=0.9" -o "$2" -w "$1 -> %{http_code} %{size_download}\n" "$1" >> $P 2>&1; }
          g "https://www.animeclick.it/manga/9544/20th-century-boys/edizioni" /tmp/ed.html
          for K in "ultimate-deluxe" "20th-century-boys\""; do
            L=$(grep -o -E '/edizione/[0-9]+/[a-z0-9.\-]*'"$K" /tmp/ed.html | head -1 | tr -d '"')
            echo "## link $K: $L" >> $P
            [ -n "$L" ] && g "https://www.animeclick.it$L" /tmp/v.html && grep -n -i -E 'og:image|\.(jpg|jpeg|png|webp)' /tmp/v.html | cut -c1-260 | head -25 >> $P
          done
          g "https://www.animeclick.it/images/Manga_Cover/1594414887_Illustration%20book.jpg" /tmp/i.jpg; file /tmp/i.jpg >> $P
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add $P; git commit -m "probe volume" || true; git pull --rebase -X theirs || true; git push
