name: Cloud diff (sola lettura)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/cloud-diff.py
        env:
          JB_KEY: ${{ secrets.JB_KEY }}
          BIN_ID: 69e0ca3836566621a8bcf811
      - run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/cloud-diff.json
          git commit -m "Cloud diff" || echo nothing
          git pull --rebase -X theirs || true
          git push
