name: Probe names
on:
  push:
    paths: ['scripts/probe-names.trigger']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/probe-names.py
        continue-on-error: true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/probe-names.txt; git commit -m "probe names" || true; git pull --rebase -X theirs || true; git push
