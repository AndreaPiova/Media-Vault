name: Anime start years
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/anime-start-years.py
        env:
          TMDB_KEY: 2dca580c2a14b55200e784d157207b4d
      - run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/anime-start-years.json
          git commit -m "Anime start years" || echo nothing
          git pull --rebase -X theirs || true
          git push
