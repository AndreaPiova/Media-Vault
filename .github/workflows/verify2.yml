name: Verify data v2
on:
  push:
    paths: ['scripts/verify2.trigger']
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: [films 0/1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: python scripts/verify2.py ${{ matrix.job }}
        env:
          FIXED: ${{ hashFiles('scripts/verify2.fixed') != '' && '1' || '0' }}
      - if: always()
        run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/verify2; git commit -m "verify2 ${{ matrix.job }}" || true
          for i in $(seq 1 12); do git fetch origin manga-publisher && git rebase -X theirs origin/manga-publisher && git push origin HEAD:manga-publisher && break; git rebase --abort 2>/dev/null; sleep $((RANDOM%15+3)); done
