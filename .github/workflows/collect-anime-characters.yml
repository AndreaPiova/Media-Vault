name: Collect anime character photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/collect-anime-characters.py
      - run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/anime-character-photos.json
          git commit -m "Foto personaggi anime (AniList)" || echo nothing
          git pull --rebase -X theirs || true
          git push
