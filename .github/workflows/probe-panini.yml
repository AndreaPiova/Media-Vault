name: Probe panini
on:
  push:
    paths: ['scripts/probepanini.trigger']
concurrency: { group: probepanini, cancel-in-progress: true }
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pillow
      - run: |
          git config user.name "mediavault-bot"
          git config user.email "bot@users.noreply.github.com"
      - run: python scripts/probe-panini.py
        continue-on-error: true
      - if: always()
        run: |
          git add data/probe; git commit -m "Cover editori finale" || true; git pull --rebase -X theirs || true; git push
