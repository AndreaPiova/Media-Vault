name: Recent
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/recent.py
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_PUBKEY: ${{ secrets.SB_PUBKEY }}
          SB_VAULT_KEY: ${{ secrets.SB_VAULT_KEY }}
      - run: |
          git config user.name "mediavault-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/recent.json
          git commit -m "CORS" || echo nothing
          git pull --rebase -X theirs || true
          git push
