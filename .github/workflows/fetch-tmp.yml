name: Dati temporanei (capitoli e personaggi)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-tmp.mjs
      - run: |
          git config user.name "tmp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tmp
          git commit -m "dati temporanei" || echo "nulla da salvare"
          git push
